    command-line flags or arguments to pass
    to the command.
  name: arguments
  type:
  - name: Array
    items:
    - name: String
  default: "[]"
- description: |-
    environment variables to set
    for the command.
  name: enviroment
  type:
  - name: Hash
    items:
    - name: String
    - name: Object
- description: |-
    command line options and values to
    pass to the command.
  name: options
  type:
  - name: Hash
    items:
    - name: String
    - name: Object
  default: "{}"
