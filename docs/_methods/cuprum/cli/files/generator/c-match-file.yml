---
name: Cuprum::Cli::Files::Generator.match_file
parent_path: cuprum/cli/files/generator
signature: match_file(pattern = nil, &block)
slug: match-file
constructor: false
data_path: cuprum/cli/files/generator/c-match-file
overloads:
- name: Cuprum::Cli::Files::Generator.match_file
  parent_path: cuprum/cli/files/generator
  signature: match_file(pattern)
  slug: match-file
  constructor: false
  description: |-
    The registered matches are checked when the generator checks whether a
    file path can be generated by the generator.

    - If the given pattern is a regular expression, the generator will
      match the pattern against the file path.
    - If the pattern is a string, the generator will check if the file
      path ends with the pattern string.
  params:
  - description: the pattern to register.
    name: pattern
    type:
    - name: Regexp
    - name: String
  returns:
  - description: ''
    type:
    - name: void
  short_description: Registers the pattern as a valid match for the generator.
- name: Cuprum::Cli::Files::Generator.match_file
  parent_path: cuprum/cli/files/generator
  signature: match_file(&block)
  slug: match-file
  constructor: false
  description: |-
    The registered matches are checked when the generator checks whether a
    file path can be generated by the generator. The given block will be
    called with the file path and generator options; if the block returns
    a truthy value, the match check returns true.
  returns:
  - description: ''
    type:
    - name: void
  short_description: Registers the block as a valid match for the generator.
  yield_params:
  - description: |-
      the input file path provided by the
      user.
    name: file_path
    type:
    - name: String
  - description: additional options for the generator.
    name: options
    type:
    - name: Hash
version: "*"
