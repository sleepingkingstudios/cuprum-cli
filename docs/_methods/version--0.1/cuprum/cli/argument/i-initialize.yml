---
name: Cuprum::Cli::Argument#initialize
parent_path: cuprum/cli/argument
signature: 'initialize(name:, default: nil, description: nil, parameter_name: nil,
  required: false, type: :string, variadic: false)'
slug: initialize
constructor: true
data_path: cuprum/cli/argument/i-initialize
params:
- description: the name of the argument.
  name: name
  type:
  - name: String
  - name: Symbol
- description: |-
    the default value for the argument. If given
    and the value of the argument is nil, sets the argument value to the
    default value.
  name: default
  type:
  - name: Object
  - name: Proc
  default: nil
- description: |-
    a short, human-readable description of the
    argument.
  name: description
  type:
  - name: String
  default: nil
- description: |-
    a representation of the possible values for
    the argument.
  name: parameter_name
  type:
  - name: String
  default: nil
- description: |-
    if true, raises an exception if the argument
    is not provided to the command.
  name: required
  type:
  - name: 'true'
  - name: 'false'
  default: 'false'
- description: |-
    the expected type of the argument
    value as a Class or class name. If given, raises an exception if the
    argument value is not an instance of the type. Defaults to :string.
  name: type
  type:
  - name: Class
  - name: String
  - name: Symbol
- description: |-
    if true, the argument is variadic and
    represents an array of arguments provided to the command. Defaults to
    false.
  name: variadic
  type:
  - name: 'true'
  - name: 'false'
  default: 'false'
returns:
- description: a new instance of Argument
  type:
  - name: Argument
version: '0.1'
