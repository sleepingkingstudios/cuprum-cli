---
name: Cuprum::Cli::Options::Verbose#say
parent_path: cuprum/cli/options/verbose
signature: 'say(message, newline: true, quiet: false, verbose: false, **options)'
slug: say
constructor: false
data_path: cuprum/cli/options/verbose/i-say
options:
- name: options
  opts:
  - description: |-
      if true, appends a newline to the
      message if the message does not end with a newline. Defaults to true.
    name: newline
    type:
    - name: 'true'
    - name: 'false'
  - description: |-
      if true, prints the message even if
      the command has the :quiet option enabled. Defaults to false. Ignored
      if
      the command does not support the :quiet option.
    name: quiet
    type:
    - name: 'true'
    - name: 'false'
  - description: |-
      if true, prints the message only
      if the command has the :verbose option enabled. Defaults to false.
      Ignored if the command does not support the :verbose option.
    name: verbose
    type:
    - name: 'true'
    - name: 'false'
params:
- description: the message to print.
  name: message
  type:
  - name: String
- description: options for printing the message.
  name: options
  type:
  - name: Hash
returns:
- description: ''
  type:
  - name: nil
short_description: Prints a message to the output stream.
version: '0.1'
