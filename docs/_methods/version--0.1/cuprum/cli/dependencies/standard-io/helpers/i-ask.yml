---
name: Cuprum::Cli::Dependencies::StandardIo::Helpers#ask
parent_path: cuprum/cli/dependencies/standard-io/helpers
signature: 'ask(prompt = nil, caret: true, format: nil, strip: true, **options)'
slug: ask
constructor: false
data_path: cuprum/cli/dependencies/standard-io/helpers/i-ask
options:
- name: options
  opts:
  - description: |-
      if true, prints a caret "> " to the
      output stream after the prompt. Defaults to true when the newline
      option is true, otherwise false.
    name: caret
    type:
    - name: 'true'
    - name: 'false'
  - description: |-
      the expected format of the
      input. Valid values are :string (the default), :boolean, and :integer.
      The input string will be transformed into the given format, or an
      exception raised if the value cannot be transformed.
    name: format
    type:
    - name: String
    - name: Symbol
  - description: |-
      if true, a newline will be printed
      after the prompt if a prompt is given.
    name: newline
    type:
    - name: 'true'
    - name: 'false'
  - description: |-
      if true, strips the trailing newline
      from the input. Defaults to true.
    name: strip
    type:
    - name: 'true'
    - name: 'false'
params:
- description: the prompt to display to the user, if any.
  name: prompt
  type:
  - name: String
  - name: nil
  default: nil
- description: options for requesting the input.
  name: options
  type:
  - name: Hash
returns:
- description: |-
    the received and formatted
    input value, or nil if the input value was empty.
  type:
  - name: String
  - name: Integer
  - name: 'true'
  - name: 'false'
  - name: nil
short_description: Requests an input from the input stream.
version: '0.1'
